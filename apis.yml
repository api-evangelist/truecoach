aid: truecoach
name: TrueCoach
description: >-
  TrueCoach is a personal-training and remote-coaching platform for strength
  coaches, personal trainers, and physical therapists to deliver workouts
  online and train clients remotely. Started as Fitbot out of Techstars
  Boulder and now an Xplor Technologies brand, it offers a web app plus iOS
  and Android client apps with program and workout builders, a video exercise
  library, nutrition tracking, wearables data, Stripe-powered payments, a
  MyFitnessPal integration, and a Zapier connector — but publishes no public
  developer API.
